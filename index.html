<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Dashboard</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <!-- HEADER -->
  <header class="header">
    <div class="header-left">
      <p id="greeting">Good morning!</p>
      <p id="dateTime"></p>
    </div>
    <div class="header-right">
      <input type="text" id="nameInput" placeholder="Your name…" maxlength="32" />
      <button id="saveNameBtn">Save</button>
      <button id="themeToggle" class="icon-btn" title="Toggle theme">🌙</button>
    </div>
  </header>

  <!-- MAIN GRID -->
  <main class="grid">

    <!-- FOCUS TIMER -->
    <section class="card">
      <h2>⏱ Focus Timer</h2>
      <div id="timerDisplay" class="timer-display">25:00</div>
      <div class="timer-buttons">
        <button id="startBtn">Start</button>
        <button id="stopBtn" class="btn-secondary">Stop</button>
        <button id="resetBtn" class="btn-secondary">Reset</button>
      </div>
      <div class="timer-custom">
        <label for="customMinutes">Custom time (min):</label>
        <input type="number" id="customMinutes" min="1" max="120" value="25" />
        <button id="setTimerBtn">Set</button>
      </div>
    </section>

    <!-- TO-DO LIST -->
    <section class="card card-wide">
      <h2>✅ To-Do List</h2>
      <div class="todo-input">
        <input type="text" id="taskInput" placeholder="Add a new task…" maxlength="100" />
        <button id="addTaskBtn">Add</button>
      </div>
      <div class="sort-bar">
        <span>Sort:</span>
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="active">Active</button>
        <button class="chip" data-filter="done">Done</button>
        <button class="chip" data-filter="az">A – Z</button>
      </div>
      <ul id="taskList"></ul>
    </section>

    <!-- QUICK LINKS -->
    <section class="card card-wide">
      <h2>🔗 Quick Links</h2>
      <div class="link-input">
        <input type="text" id="linkName"  placeholder="Label (e.g. YouTube)" maxlength="30" />
        <input type="url"  id="linkUrl"   placeholder="https://…" />
        <button id="addLinkBtn">Add</button>
      </div>
      <div id="linksContainer" class="links-container"></div>
    </section>

  </main>

  <!-- EDIT MODAL -->
  <div id="modalOverlay" class="modal-overlay hidden"></div>
  <div id="editModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <h3 id="modalTitle">Edit Task</h3>
    <input type="text" id="editInput" maxlength="100" />
    <p id="editError" class="error-msg hidden"></p>
    <div class="modal-actions">
      <button id="editSaveBtn">Save</button>
      <button id="editCancelBtn" class="btn-secondary">Cancel</button>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden"></div>

  <script src="js/script.js"></script>
</body>
</html>
